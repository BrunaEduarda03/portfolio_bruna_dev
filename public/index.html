<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem("portfolio_theme"); } catch (_) {}
        var theme = saved === "light" || saved === "dark" ? saved : "dark";
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0a0a0a" : "#e9e5dd";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="description" content="Bruna Maciel — Software Engineer" />
    <title>Bruna Maciel — Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
